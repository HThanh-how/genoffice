<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' ws://localhost:*"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GenOffice Update</title>
    <link rel="stylesheet" href="../../../../packages/ui/src/tokens.css" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      :root {
        --ui-cjk: 'Microsoft YaHei', 'PingFang SC';
      }
      :root:lang(ja) {
        --ui-cjk:
          'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Yu Gothic UI', 'Yu Gothic', 'Meiryo';
      }
      :root:lang(ko) {
        --ui-cjk: 'Apple SD Gothic Neo', 'Malgun Gothic';
      }
      :root:lang(zh-TW) {
        --ui-cjk: 'PingFang TC', 'Microsoft JhengHei';
      }
      html,
      body {
        height: 100%;
        font-family: -apple-system, 'Segoe UI', var(--ui-cjk), sans-serif;
        color: var(--text);
        background: transparent;
        user-select: none;
      }
      body {
        padding: 8px;
      }
      #card {
        min-height: 100%;
        display: flex;
        flex-direction: column;
        background: var(--surface);
        border-radius: 22px;
        border: 1px solid var(--border);
        overflow: hidden;
        box-shadow: var(--shadow-menu);
        animation: card-enter 220ms ease-out;
      }
      #hero {
        -webkit-app-region: drag;
        position: relative;
        padding: 30px 30px 24px;
        display: flex;
        align-items: flex-start;
        gap: 16px;
        background: linear-gradient(
          135deg,
          color-mix(in srgb, var(--color-brand-secondary) 10%, var(--surface)),
          var(--surface) 80%
        );
      }
      #hero img {
        width: 52px;
        height: 52px;
        flex: none;
        border-radius: 14px;
        box-shadow: var(--shadow-btn-hover);
      }
      #close {
        position: absolute;
        top: 12px;
        right: 12px;
        width: 28px;
        height: 28px;
        border: none;
        border-radius: 8px;
        display: grid;
        place-items: center;
        color: var(--text-secondary);
        background: transparent;
      }
      #close:hover {
        color: var(--text);
        background: var(--hover);
      }
      .hero-copy {
        min-width: 0;
        flex: 1;
      }
      .brand {
        font-size: 11px;
        font-weight: 650;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--text-secondary);
        margin-bottom: 7px;
      }
      #headline {
        font-size: 21px;
        line-height: 1.3;
        font-weight: 650;
        letter-spacing: -0.035em;
        overflow-wrap: anywhere;
      }
      #versions {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-top: 16px;
        color: var(--text-muted);
        font-size: 12px;
      }
      #versions .chip {
        border: 1px solid var(--border);
        background: var(--surface);
        border-radius: 8px;
        padding: 5px 9px;
        font-variant-numeric: tabular-nums;
      }
      #versions .chip.new {
        background: color-mix(in srgb, var(--color-brand-secondary) 10%, var(--surface));
        border-color: color-mix(in srgb, var(--color-brand-secondary) 25%, var(--border));
        color: var(--color-brand-secondary);
        font-weight: 650;
      }
      #body {
        flex: 1;
        display: flex;
        flex-direction: column;
        gap: 20px;
        padding: 0 30px 24px;
      }
      #desc {
        min-height: 84px;
        padding: 16px;
        border: 1px solid var(--border-subtle);
        border-radius: 12px;
        background: var(--surface-subtle);
        font-size: 13px;
        line-height: 1.65;
        color: var(--text-secondary);
        overflow-wrap: anywhere;
        user-select: text;
      }
      #desc.error {
        color: var(--danger);
        border-color: var(--danger-border);
        background: var(--danger-bg);
      }
      .actions {
        margin-top: auto;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      button {
        -webkit-app-region: no-drag;
        font: inherit;
        cursor: pointer;
        transition:
          background 150ms ease,
          transform 150ms ease;
      }
      button:focus-visible {
        outline: 2px solid var(--color-brand-secondary);
        outline-offset: 3px;
      }
      button:active {
        transform: translateY(1px);
      }
      #action {
        width: 100%;
        min-height: 44px;
        padding: 11px 16px;
        border: 1px solid transparent;
        border-radius: 11px;
        background: var(--color-btn-primary);
        color: var(--color-btn-primary-text);
        font-size: 13px;
        font-weight: 650;
      }
      #action:hover {
        background: var(--color-btn-primary-hover);
      }
      #progress {
        width: 100%;
        display: none;
        flex-direction: column;
        gap: 10px;
        padding: 16px;
        background: var(--surface-subtle);
        border: 1px solid var(--border-subtle);
        border-radius: 12px;
      }
      #progress .track {
        width: 100%;
        height: 6px;
        border-radius: 999px;
        background: var(--border);
        overflow: hidden;
      }
      #progress .bar {
        height: 100%;
        width: 0;
        border-radius: 999px;
        background: linear-gradient(90deg, var(--color-brand-secondary), var(--color-ai-action));
        transition: width 200ms ease;
      }
      #progress .label {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        font-size: 12px;
        line-height: 1.5;
        color: var(--text-secondary);
        font-variant-numeric: tabular-nums;
      }
      #percent {
        font-weight: 650;
        color: var(--text);
      }
      #later {
        width: 100%;
        min-height: 36px;
        padding: 8px 12px;
        border: none;
        border-radius: 9px;
        background: transparent;
        font-size: 12px;
        color: var(--text-secondary);
      }
      #later:hover {
        color: var(--text);
        background: var(--hover);
      }
      @keyframes card-enter {
        from {
          opacity: 0;
          transform: translateY(6px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #card {
          animation: none;
        }
        button,
        #progress .bar {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <div
      id="card"
      role="dialog"
      aria-modal="true"
      aria-labelledby="headline"
      aria-describedby="desc"
    >
      <div id="hero">
        <button id="close" type="button">
          <svg width="14" height="14" viewBox="0 0 16 16" fill="none" aria-hidden="true">
            <path
              d="m4 4 8 8M12 4l-8 8"
              stroke="currentColor"
              stroke-width="1.5"
              stroke-linecap="round"
            />
          </svg>
        </button>
        <img src="./src/assets/app-icon.png" alt="" />
        <div class="hero-copy">
          <div class="brand">GenOffice</div>
          <h1 id="headline"></h1>
          <div id="versions">
            <span class="chip" id="ver-current"></span>
            <span aria-hidden="true">→</span>
            <span class="chip new" id="ver-new"></span>
          </div>
        </div>
      </div>
      <div id="body">
        <div id="desc" role="status" aria-live="polite"></div>
        <div
          id="progress"
          role="progressbar"
          aria-valuemin="0"
          aria-valuemax="100"
          aria-labelledby="progress-text"
        >
          <div class="track"><div class="bar" id="bar"></div></div>
          <div class="label"><span id="progress-text"></span><span id="percent"></span></div>
        </div>
        <div class="actions">
          <button id="action" type="button"></button>
          <button id="later" type="button"></button>
        </div>
      </div>
    </div>
    <script type="module" src="/src/update.ts"></script>
  </body>
</html>
