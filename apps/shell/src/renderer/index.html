<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data: blob:; worker-src 'self' blob:; connect-src 'self' ws://localhost:*"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GenOffice</title>
    <!-- first paint before the bundle: the window's colour scheme already follows the saved theme
         (nativeTheme.themeSource), so prefers-color-scheme paints the right surface, not white -->
    <style>
      :root {
        --boot-bg: #ffffff;
        color-scheme: light dark;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --boot-bg: #1e1e1e;
        }
      }
      html,
      body {
        background: var(--boot-bg);
        margin: 0;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
