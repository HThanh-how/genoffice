name: Publish signed auto-update release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      has_windows: ${{ steps.check.outputs.has_windows }}
      has_macos: ${{ steps.check.outputs.has_macos }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify release version and platform signing credentials
        id: check
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          test "$GITHUB_REF_NAME" = "v$(node -p "require('./apps/shell/package.json').version")"
          has_win=false
          has_mac=false
          if [ -n "$WIN_CSC_LINK" ] && [ -n "$WIN_CSC_KEY_PASSWORD" ]; then
            has_win=true
          fi
          if [ -n "$MAC_CSC_LINK" ] && [ -n "$MAC_CSC_KEY_PASSWORD" ] && [ -n "$APPLE_ID" ] && [ -n "$APPLE_APP_SPECIFIC_PASSWORD" ] && [ -n "$APPLE_TEAM_ID" ]; then
            has_mac=true
          fi
          if [ "$has_win" != "true" ] && [ "$has_mac" != "true" ]; then
            echo "::error::No platform has complete signing credentials configured. Windows requires WIN_CSC_LINK and WIN_CSC_KEY_PASSWORD. macOS requires MAC_CSC_LINK, MAC_CSC_KEY_PASSWORD, APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, and APPLE_TEAM_ID."
            exit 1
          fi
          echo "has_windows=$has_win" >> "$GITHUB_OUTPUT"
          echo "has_macos=$has_mac" >> "$GITHUB_OUTPUT"
      - name: Create private draft until platform builds pass and validate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if draft=$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft'); then
            if [ "$draft" != "true" ]; then
              echo "::error::Release $GITHUB_REF_NAME is already published; refusing to modify it."
              exit 1
            fi
            echo "Reusing existing draft $GITHUB_REF_NAME."
          else
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --draft --title "GenOffice $GITHUB_REF_NAME" --generate-notes
          fi

  windows:
    needs: prepare
    if: needs.prepare.outputs.has_windows == 'true'
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable branch, 2026-07
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc
      - run: npm ci
      - run: npm run fixtures
      - name: Build and publish signed NSIS update
        shell: pwsh
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          GENOFFICE_UPDATE_REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          npm run notices
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run build:all
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $source = 'apps/sheets/native/xlsx-engine/target/release/xlsx-sidecar.exe'
          $target = 'apps/sheets/native/xlsx-engine/target/x86_64-pc-windows-gnu/release/xlsx-sidecar.exe'
          if (-not (Test-Path -LiteralPath $source)) { throw "Missing built sidecar: $source" }
          New-Item -ItemType Directory -Force -Path (Split-Path -Parent $target) | Out-Null
          Copy-Item -LiteralPath $source -Destination $target
          npm run dist:win -w @genoffice/shell -- --publish always
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $installer = Get-ChildItem apps/shell/release -Filter '*.exe' | Select-Object -First 1
          if (-not $installer -or (Get-AuthenticodeSignature -LiteralPath $installer.FullName).Status -ne 'Valid') {
            throw 'Release installer is not Authenticode signed'
          }

  macos:
    needs: prepare
    if: needs.prepare.outputs.has_macos == 'true'
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable branch, 2026-07
        with:
          toolchain: stable
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - run: npm ci
      - run: npm run fixtures
      - name: Build and package signed Apple Silicon update
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          GENOFFICE_UPDATE_REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          npm run notices
          npm run build:all
          npm run native:build:universal -w @genoffice/sheets
          npm run dist:mac -w @genoffice/shell -- --publish never
      - name: Verify app codesign, notarization, staple, and feed hashes
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: node tools/verify-mac-release.mjs apps/shell/release
      - name: Upload verified original Mac artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd apps/shell/release
          shasum -a 256 -- *.dmg *-mac.zip latest-mac.yml > macos-SHA256SUMS
          gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" -- *.dmg *-mac.zip latest-mac.yml macos-SHA256SUMS

  publish:
    needs: [prepare, windows, macos]
    if: always() && needs.prepare.result == 'success' && !contains(needs.*.result, 'failure') && !cancelled() && (needs.windows.result == 'success' || needs.macos.result == 'success')
    runs-on: ubuntu-24.04
    steps:
      - name: Verify update feeds and publish release
        env:
          GH_TOKEN: ${{ github.token }}
          HAS_WINDOWS: ${{ needs.prepare.outputs.has_windows }}
          HAS_MACOS: ${{ needs.prepare.outputs.has_macos }}
        run: |
          assets=$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')
          if [ "$HAS_WINDOWS" = "true" ]; then
            printf '%s\n' "$assets" | grep -qx latest.yml || { echo "Missing latest.yml in release assets"; exit 1; }
          fi
          if [ "$HAS_MACOS" = "true" ]; then
            printf '%s\n' "$assets" | grep -qx latest-mac.yml || { echo "Missing latest-mac.yml in release assets"; exit 1; }
          fi
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --latest
