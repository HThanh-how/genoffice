name: Document Search V2 CI

on:
  push:
    branches: [fix/document-search-v2]
  pull_request:
    branches: [fix/document-search-v2]

concurrency:
  group: document-search-v2-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }}, Node ${{ matrix.node-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        node-version: ['22.x']

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck shell
        run: npm --prefix apps/shell run typecheck

      - name: Run Core Document Search Test Suites
        run: >-
          npx --prefix apps/shell vitest run
          tests/ann-index.test.ts
          tests/ann-coherence.test.ts
          tests/chunk-sets.test.ts
          tests/chunk-upgrade.test.ts
          tests/embedding-migration.test.ts
          tests/embedding-profiles.test.ts
          tests/embedding-space.test.ts
          tests/file-stability.test.ts
          tests/hot-name-search.test.ts
          tests/indexing-policy.test.ts
          tests/indexing-worker-policy.test.ts
          tests/legacy-vector-migration.test.ts
          tests/low-memory.test.ts
          tests/progressive-search.test.ts
          tests/progressive-search-no-double-fts.test.ts
          tests/document-memory-manager.test.ts
          tests/document-memory-folder-scan.test.ts
          tests/document-memory-folder-watch.test.ts
          tests/everything-ipc.test.ts
          tests/known-sources.test.ts
          tests/ui-search-recents-sources.test.ts
