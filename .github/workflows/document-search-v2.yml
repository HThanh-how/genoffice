name: Document Search V2 CI

on:
  push:
    branches: [fix/document-search-v2]
  pull_request:
    branches: [fix/document-search-v2]

concurrency:
  group: document-search-v2-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }}, Node ${{ matrix.node-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        node-version: ['22.x']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck shell
        run: npm --prefix apps/shell run typecheck

      - name: Run Core Document Search Test Suites
        run: npx --prefix apps/shell vitest run tests/ann-index.test.ts tests/ann-coherence.test.ts tests/embedding-profiles.test.ts tests/indexing-policy.test.ts tests/indexing-worker-policy.test.ts tests/document-memory-issues.test.ts tests/document-memory-manager.test.ts tests/everything-ipc.test.ts
